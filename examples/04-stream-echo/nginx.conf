load_module modules/ngx_stream_echo_module.so;

user  nginx;
worker_processes  0;

error_log  /var/log/nginx/error.log debug; 
master_process off;
daemon off;

events {
  worker_connections  2;
}

stream {
    server {
        listen 9000;
        stream_echo on;
        proxy_pass 127.0.0.1:9001;
    }
}
