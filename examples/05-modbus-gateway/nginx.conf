load_module modules/ngx_stream_modbus_proxy_module.so;

user  nginx;
worker_processes  0;

error_log  /var/log/nginx/error.log debug; 
master_process off;
daemon off;

events {
  worker_connections  3;
}

stream {
 server {
        listen 502;
        
        # Define modbus routing rules.
        # Optional per-block "timeout": absolute max session duration. After it
        # elapses the connection is closed regardless of activity. 0/omitted = unlimited.
        modbus 1 {
            host 10.20.20.1:502;
            timeout 2s;
        }

        modbus 2 {
            host 10.20.20.2:502;
            timeout 2s;
        }

        modbus 3 {
            host 10.20.20.3:502;
            timeout 3s;
        }

        modbus default {
            host 10.20.20.254:502;
            timeout 2s;
        }

        # Use the variable for dynamic routing (handled by the stream proxy module)
        proxy_pass $proxy_pass;
    }
}
