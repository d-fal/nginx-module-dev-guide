load_module modules/ngx_stream_modbus_proxy_module.so;

user  nginx;
worker_processes  0;

error_log  /var/log/nginx/error.log debug; 
master_process off;
daemon off;

events {
  # Each rtu slave also consumes a connection slot for its serial fd, so keep
  # this comfortably above the number of concurrent clients + serial ports.
  worker_connections  1024;
}

stream {
 server {
        listen 502;

        # RTU serial-bus parameters. One physical RS-485 line carries many slave
        # addresses, so these describe the bus and are set here at the server
        # level (NOT inside a modbus block). Required only if a "mode rtu" block
        # exists. Defaults: 9600 baud, 8 data bits, no parity, 1 stop bit, 1s
        # reply timeout. Point "serial" at a real /dev/ttyUSB* or a pty for testing.
        serial /tmp/ttyA;
        baud 9600;
        data_bits 8;
        parity none;
        stop_bits 1;
        response_timeout 1s;

        # Define modbus routing rules: modbus <slave_id> [mode] { ... }
        # The mode (tcp|rtu) is the optional 2nd argument; it defaults to tcp.
        # Optional per-block "timeout": absolute max session duration. After it
        # elapses the connection is closed regardless of activity. 0/omitted = unlimited.
        #
        # tcp  -> proxy to a backend "host" (handled by ngx_stream_proxy).
        # rtu  -> bridge to the serial bus above; the unit id is used as the
        #         RTU slave address on the wire. tcp and rtu slaves can coexist.
        modbus 1 tcp {
            host 127.0.0.1:1502;
            timeout 2s;
            deny_ops read_coils;
        }

        # Modbus TCP -> RTU serial gateway. The request's unit id (5) is sent as
        # the RTU slave address on the shared serial bus configured above.
        modbus 5 rtu {
        }

        modbus 3 tcp {
            host 10.20.20.3:502;
            timeout 3s;
        }

        modbus default tcp {
            host 10.20.20.254:502;
            timeout 2s;
        }

        # Mandatory content handler (stock ngx_stream_proxy_module). It appears
        # ONCE here, NOT inside the blocks: tcp-mode units are proxied via the
        # $proxy_pass variable set during preread; rtu-mode units never reach it
        # (they are taken over and bridged to serial in the preread phase).
        proxy_pass $proxy_pass;
    }
}
