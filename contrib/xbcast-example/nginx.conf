load_module modules/ngx_stream_xbcast_module.so;

# need >= 2 workers to actually see cross-worker delivery
worker_processes  2;

error_log  /var/log/nginx/error.log notice;
daemon off;

events { }

stream {
    server {
        # reuseport => kernel spreads connections across both workers,
        # so two `nc` clients are likely to land on different workers
        listen 0.0.0.0:9000 reuseport;

        stream_xbcast on;

        # content phase: just acknowledge, so the connection completes
        return "ok\n";
    }
}
